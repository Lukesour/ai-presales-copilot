[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-presales-copilot"
version = "0.3.0"
description = "An evidence-aware AI presales copilot for auditable solution design and POC planning."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
runtime = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "opentelemetry-api>=1.28,<2",
    "opentelemetry-sdk>=1.28,<2",
    "uvicorn[standard]>=0.34,<1",
]
demo = ["gradio>=5.0"]
knowledge = [
    "PyMuPDF>=1.24,<2",
    "python-docx>=1.1,<2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pip-audit>=2.7",
    "ruff>=0.9",
    "mypy>=1.14",
    "httpx>=0.28",
]
agent = ["langgraph>=1.0,<2"]
finetune = [
    "accelerate>=1.0",
    "bitsandbytes>=0.43",
    "datasets>=3.0",
    "peft>=0.13",
    "torch>=2.4",
    "transformers>=4.46",
    "trl>=0.15"
]
finetune-colab = [
    "accelerate>=1.0,<2",
    "bitsandbytes>=0.43,<1",
    "datasets>=3.0,<5",
    "peft>=0.13,<1",
    "transformers>=4.46,<5",
    "trl>=0.15,<1"
]
all = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "opentelemetry-api>=1.28,<2",
    "opentelemetry-sdk>=1.28,<2",
    "uvicorn[standard]>=0.34,<1",
    "gradio>=5.0",
    "PyMuPDF>=1.24,<2",
    "python-docx>=1.1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]
