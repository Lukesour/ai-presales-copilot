name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.11"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra runtime --extra dev
      - run: make governance
      - run: make openapi-check
      - run: make file-length
      - run: make schema-check
      - run: make test
      - run: make lint
      - run: make eval EVAL_OUTPUT=/tmp/evaluation.json
      - run: make security-check SECURITY_OUTPUT=/tmp/security.json
      - run: make demo-replay-check
      - run: make dataset-check
      - run: git diff --check
      - run: PYTHONPATH=src:. uv run --locked --extra runtime --extra dev python scripts/ingest_sources.py --chunks /tmp/chunks.jsonl --manifest /tmp/manifest.jsonl
      - run: docker compose -f deploy/compose.agent.yaml config

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.11"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra runtime --extra dev
      - run: uv run --locked --extra runtime --extra dev pip-audit
