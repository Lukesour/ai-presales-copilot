name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.11"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra runtime --extra dev
      - run: uv run pytest -q
      - run: uv run ruff check src scripts tests migrations
      - run: uv run python scripts/run_eval.py --output /tmp/evaluation.json
      - run: uv run python scripts/run_security_checks.py --output /tmp/security.json
      - run: uv run python scripts/check_finetune_dataset.py
      - run: uv run python scripts/ingest_sources.py --chunks /tmp/chunks.jsonl --manifest /tmp/manifest.jsonl
      - run: docker compose -f deploy/compose.agent.yaml config

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.11"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra runtime --extra dev
      - run: uv run pip-audit
